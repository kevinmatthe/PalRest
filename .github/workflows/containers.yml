name: Containers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping publications for the same ref.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Service and WebUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm --prefix webui ci
      - run: npm --prefix webui test

  image:
    name: Image (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service
            dockerfile: Dockerfile
            suffix: ""
          - name: webui
            dockerfile: webui/Dockerfile
            suffix: -webui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Verify map assets
        if: matrix.name == 'webui'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tiles = list(Path('webui/public/map/tiles').rglob('*.png'))
          assert tiles, 'Map tiles are missing'
          for tile in tiles:
              with tile.open('rb') as stream:
                  assert stream.read(8) == b'\x89PNG\r\n\x1a\n', f'Invalid PNG or LFS pointer: {tile}'
          print(f'Verified {len(tiles)} map tiles')
          PY
      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build image for verification
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: palrest-ci:${{ matrix.name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=container-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.name }}
      - name: Test packaged save worker
        if: matrix.name == 'service'
        run: |
          docker run --rm --entrypoint /usr/local/bin/palrest-save-worker palrest-ci:service --help
          docker run --rm --entrypoint /opt/palrest-save-worker/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tools/save_worker:/tests:ro" palrest-ci:service \
            -m unittest discover -s /tests -p 'test_*.py'
      - name: Test packaged WebUI
        if: matrix.name == 'webui'
        run: |
          docker run --rm --entrypoint sh palrest-ci:webui -ec \
            'test -s /srv/index.html && test -s /srv/map/tiles/0/0/0.png && caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            PIP_INDEX_URL=https://pypi.org/simple
